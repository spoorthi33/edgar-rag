[project]
name = "edgar-rag"
version = "0.1.0"
description = "Retrieval-augmented QA over SEC EDGAR 10-K and 10-Q filings"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # config / models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ingest
    "httpx>=0.27",
    "tenacity>=8.3",
    # parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # embeddings + index
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    # orchestration
    "langchain>=0.2",
    "langchain-core>=0.2",
    "llama-index-core>=0.10",
    # generation
    "anthropic>=0.34",
    "openai>=1.40",
    # service + storage
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "boto3>=1.34",
    # eval
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults, but that is exactly
# how FastAPI declares dependencies — the call is evaluated once at import
# and resolved per request by the framework.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["edgar_rag"]
mypy_path = "src"
ignore_missing_imports = true
