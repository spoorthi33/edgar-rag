services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgar
      POSTGRES_PASSWORD: edgar
      POSTGRES_DB: edgar_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgar -d edgar_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Enabled from Phase 7, once the FastAPI service exists.
  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edgar:edgar@db:5432/edgar_rag
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
